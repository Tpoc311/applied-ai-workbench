services:
  pytorch-workspace:
    image: pytorch-workspace:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: docker/pytorch-workspace.dockerfile
      args:
        USERNAME: ${USER}
        PASSWORD: ${PASSWORD}
    container_name: pytorch-workspace
    shm_size: "8gb"
    gpus: all
    volumes:
      - .:/home/${USER}/applied-ai-workbench/pytorch
      - /nvme/github/applied-ai-workbench/artifacts:/home/${USER}/applied-ai-workbench/artifacts:rw
    ports:
      - "8002:22"
    restart: always